name: Release readiness checks
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      docker:
        description: 'Optional historical Docker validation (not required for native deployment)'
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  backend:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12.13'
      - name: Show actual interpreter
        run: python --version
      - run: python -m pip install --require-hashes -r deploy/backend/requirements.lock -r deploy/backend/build.lock -r deploy/backend/test.lock
      - run: python -m pip install --no-build-isolation --no-deps -e .
      - run: python -m pip check
      - run: python -m unittest discover -s tests -v
      - run: python -m tools.review_public_files
      - run: python -m tools.export_frontend_contract --check
      - run: python -m tools.review_history
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.19.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm audit --audit-level=low
        working-directory: frontend
      - run: npm run typecheck
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
        env: {VITE_API_BASE_URL: same-origin}
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: {python-version: '3.12.13'}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: {node-version: '24.19.0'}
      - run: python -m pip install --require-hashes -r deploy/backend/requirements.lock -r deploy/backend/build.lock -r deploy/backend/test.lock
      - run: python -m pip install --no-build-isolation --no-deps -e .
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend
      - run: npx playwright test --config playwright.security.config.ts
        working-directory: frontend
      - run: npm run build -- --outDir ../.tmp/optimization-dist
        working-directory: frontend
      - run: npx playwright test --config playwright.optimization.config.ts
        working-directory: frontend
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: synthetic-browser-reports
          retention-days: 7
          path: |
            frontend/playwright-report
            frontend/playwright-security-report
            frontend/test-results
            frontend/security-test-results
            frontend/optimization-test-results
            frontend/playwright-optimization-report
  native-windows:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      WORKFLOW_DOCTOR_PYTHON: ${{ github.workspace }}/.venv/Scripts/python.exe
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: {python-version: '3.12.13'}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: {node-version: '24.19.0'}
      - run: |
          python -m venv .venv
          ./.venv/Scripts/python.exe -m pip install --require-hashes -r deploy/backend/requirements.lock -r deploy/backend/build.lock -r deploy/backend/test.lock
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./.venv/Scripts/python.exe -m pip install --no-build-isolation --no-deps -e .
      - run: npm.cmd ci
        working-directory: frontend
      - run: npm.cmd run build
        working-directory: frontend
        env: {VITE_API_BASE_URL: same-origin}
      - run: npx.cmd playwright install chromium
        working-directory: frontend
      - run: ./start.ps1
      - run: npx.cmd playwright test --config playwright.native.config.ts
        working-directory: frontend
      - run: ./stop.ps1
        if: always()
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: synthetic-native-windows-reports
          retention-days: 7
          path: |
            frontend/playwright-native-report
            frontend/native-test-results
  docker:
    if: github.event_name == 'workflow_dispatch' && inputs.docker
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: {python-version: '3.12.13'}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: {node-version: '24.19.0'}
      - run: docker info
      - run: docker compose config --quiet
      - run: docker compose build --pull
      - run: docker compose up -d --wait --wait-timeout 90
      - run: docker compose ps
      - run: docker compose exec -T frontend nginx -t
      - run: python -m tools.docker_smoke --restart
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npx playwright test --config playwright.docker.config.ts
        working-directory: frontend
      - run: docker compose stop
      - run: docker compose up -d --wait --wait-timeout 90
      - run: python -m tools.docker_smoke
      - name: Collect bounded synthetic service logs
        if: always()
        run: |
          mkdir -p output
          docker compose logs --no-color --tail 100 > output/compose.log
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: synthetic-docker-reports
          retention-days: 7
          path: |
            output
            frontend/playwright-docker-report
            frontend/docker-test-results
      - run: docker compose down
        if: always()
