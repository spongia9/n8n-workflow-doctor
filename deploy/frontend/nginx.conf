worker_processes 1;
pid /tmp/nginx.pid;
# No request/body/header logging, including error request-line fragments.
error_log /dev/null;
events { worker_connections 64; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    server_tokens off;
    client_max_body_size 8m;
    client_body_timeout 15s;
    client_header_timeout 15s;
    keepalive_timeout 5s;
    send_timeout 15s;
    client_body_temp_path /tmp/client;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    resolver 127.0.0.11 valid=10s ipv6=off;
    map $http_host $local_host_ok {
        default 0;
        "~^(localhost|127\\.0\\.0\\.1)(:[0-9]{1,5})?$" 1;
    }
    server {
        listen 8080;
        server_name localhost 127.0.0.1;
        root /usr/share/nginx/html;
        if ($local_host_ok = 0) { return 400; }
        error_page 413 = @too_large;
        error_page 502 504 = @unavailable;
        location @too_large {
            include /etc/nginx/static-headers.conf;
            default_type application/json;
            return 413 '{"error":{"code":"UPLOAD_REQUEST_TOO_LARGE","message":"Upload request exceeds the proxy byte limit"}}';
        }
        location @unavailable {
            include /etc/nginx/static-headers.conf;
            default_type application/json;
            return 503 '{"error":{"code":"PROXY_UNAVAILABLE","message":"The local backend is unavailable; retry later"}}';
        }
        location ^~ /api/ { include /etc/nginx/proxy.conf; }
        location = /health { include /etc/nginx/proxy.conf; }
        location = /docs { include /etc/nginx/proxy.conf; }
        location = /openapi.json { include /etc/nginx/proxy.conf; }
        location ^~ /docs-assets/ { include /etc/nginx/proxy.conf; }
        location ~ (^|/)\. { return 404; }
        location /assets/ {
            include /etc/nginx/static-headers.conf;
            try_files $uri =404;
        }
        location / {
            include /etc/nginx/static-headers.conf;
            try_files $uri $uri/ /index.html;
        }
    }
}
