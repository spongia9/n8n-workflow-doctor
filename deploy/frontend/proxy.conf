set $doctor_backend http://backend:8000;
proxy_pass $doctor_backend;
proxy_http_version 1.1;
proxy_set_header Host $http_host;
proxy_set_header Origin $http_origin;
proxy_set_header Connection "";
proxy_set_header Authorization "";
proxy_set_header Cookie "";
proxy_set_header X-Forwarded-For "";
proxy_set_header X-Forwarded-Host "";
proxy_set_header X-Forwarded-Proto "";
proxy_request_buffering off;
proxy_buffering off;
proxy_max_temp_file_size 0;
proxy_connect_timeout 3s;
proxy_send_timeout 20s;
proxy_read_timeout 125s;
# A synchronous POST must never be replayed against a restarted backend.
proxy_next_upstream off;
# Preserve the backend's structured 400/413/422 codes. Nginx-generated upstream
# connection errors still use the server's 502/504 error pages.
proxy_intercept_errors off;
